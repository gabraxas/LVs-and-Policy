<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="발사장 위도와 방위각이 경사각을 결정하는 구면삼각형" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>발사장 위도와 방위각이 경사각을 결정하는 구면삼각형</title>
<desc>발사장, 승교점, 발사장 바로 아래 적도점을 꼭짓점으로 하는 직각 구면삼각형. 발사장 위도 파이, 발사 방위각 베타, 궤도경사각 i의 관계를 나타냄</desc>
<defs>
<marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path class="mk-t" d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
svg{font-family:Pretendard,"Noto Sans KR","NanumGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bg{fill:#FFFFFF}
.tt{font-size:14px;font-weight:500}
.st{font-size:12px;font-weight:400}
.lb{fill:#3d3d3a}
.earth{fill:#E6F1FB;stroke:#185FA5;stroke-width:.5}
.pole{fill:#0C447C}
.eq-f{fill:none;stroke:#5F5E5A;stroke-width:1.5}
.eq-b{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:5 4}
.gt-f{fill:none;stroke:#D85A30;stroke-width:2}
.gt-b{fill:none;stroke:#D85A30;stroke-width:1.2;stroke-dasharray:5 4}
.mer{fill:none;stroke:#0F6E56;stroke-width:1.8}
.rt{fill:none;stroke:#0F6E56;stroke-width:1}
.arc-i{fill:none;stroke:#D85A30;stroke-width:1.2}
.arc-b{fill:none;stroke:#0F6E56;stroke-width:1.2}
.nray{stroke:#0F6E56;stroke-width:1.2}
.t-o{fill:#993C1D}.t-t{fill:#085041}
.dot-o{fill:#993C1D}.dot-t{fill:#085041}.dot-g{fill:#5F5E5A}
.lead{fill:none;stroke:#888780;stroke-width:.5;stroke-dasharray:3 3}
@media (prefers-color-scheme:dark){
.bg{fill:#26251F}
.lb{fill:#c2c0b6}
.earth{fill:#0C447C;stroke:#85B7EB}
.pole{fill:#B5D4F4}
.eq-f{stroke:#D3D1C7}.eq-b{stroke:#9c9a92}
.gt-f{stroke:#F0997B}.gt-b{stroke:#F0997B}
.mer{stroke:#5DCAA5}.rt{stroke:#5DCAA5}
.arc-i{stroke:#F0997B}.arc-b{stroke:#5DCAA5}.nray{stroke:#5DCAA5}.mk-t{stroke:#5DCAA5}
.t-o{fill:#F5C4B3}.t-t{fill:#9FE1CB}
.dot-o{fill:#F5C4B3}.dot-t{fill:#9FE1CB}.dot-g{fill:#B4B2A9}
.lead{stroke:#9c9a92}
}
</style>

<rect class="bg" x="0" y="0" width="680" height="380" rx="12"/>

<circle class="earth" cx="300" cy="205" r="140"/>

<path class="eq-b" d="M160 205 A140 65.7 0 0 1 440 205"/>
<path class="gt-b" d="M218.8 319 A140 41.2 125.5 0 1 381.2 91"/>
<path class="eq-f" d="M160 205 A140 65.7 0 0 0 440 205"/>
<path class="gt-f" d="M218.8 319 A140 41.2 125.5 0 0 381.2 91"/>

<path class="mer" d="M379.1 259.2 L378.2 239.8 L375.4 219.5 L370.9 198.9 L364.8 178.5"/>
<path class="rt" d="M390.5 255.5 L388.4 243.7 L377 247.4"/>
<text class="st t-t" x="390" y="218">φ</text>

<path class="arc-i" d="M336 270.7 A36 36 0 0 0 324.3 244.1"/>
<text class="tt t-o" x="346" y="253">i</text>

<line class="nray" x1="364.8" y1="178.5" x2="347.9" y2="129.3" marker-end="url(#arrT)"/>
<path class="arc-b" d="M353.8 146.4 A34 34 0 0 1 380.6 148.4"/>
<text class="tt t-t" x="368" y="133" text-anchor="middle">β</text>

<circle class="dot-t" cx="364.8" cy="178.5" r="4.5"/>
<circle class="dot-o" cx="300" cy="270.7" r="4"/>
<circle class="dot-g" cx="379.1" cy="259.2" r="2.5"/>
<circle class="pole" cx="300" cy="81.4" r="3"/>
