<path class="lead" d="M364.8 178.5 L490 150"/>
<text class="st lb" x="496" y="154">발사장 (위도 φ)</text>
<path class="lead" d="M387.9 108.8 L470 88"/>
<text class="st lb" x="476" y="92">지상궤적</text>
<path class="lead" d="M300 270.7 L215 320"/>
<text class="st lb" x="209" y="324" text-anchor="end">승교점</text>
<path class="lead" d="M178.8 237.9 L158 246"/>
<text class="st lb" x="152" y="250" text-anchor="end">적도</text>
</svg>
