<svg xmlns="http://www.w3.org/2000/svg" width="680" height="473" viewBox="0 0 680 473" role="img" aria-label="뉴턴의 포탄 사고실험과 제1우주속도" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>뉴턴의 포탄 사고실험과 제1우주속도</title>
<desc>산 정상의 대포에서 수평으로 발사된 포탄이 발사속도 증가에 따라 사거리가 늘어나다가, 제1우주속도에 도달하면 지구 곡률을 따라 닫힌 원궤도를 그리게 되는 과정</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
svg{font-family:Pretendard,"Noto Sans KR","NanumGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bg{fill:#FFFFFF}
.tt{font-size:14px;font-weight:500}
.st{font-size:12px;font-weight:400}
.lb{fill:#3d3d3a}
.earth{fill:#E6F1FB;stroke:#185FA5;stroke-width:.5}
.e-t{fill:#0C447C}.e-s{fill:#185FA5}
.orbit{fill:none;stroke:#BA7517;stroke-width:1.5;stroke-dasharray:6 5}
.traj{fill:none;stroke:#888780;stroke-width:1.5}
.lead{fill:none;stroke:#888780;stroke-width:.5;stroke-dasharray:3 3}
.mtn{fill:#888780}
.gun{stroke:#444441;stroke-width:4;stroke-linecap:round}
.bdg{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.b-t{fill:#2C2C2A}
@media (prefers-color-scheme:dark){
.bg{fill:#26251F}
.lb{fill:#c2c0b6}
.earth{fill:#0C447C;stroke:#85B7EB}
.e-t{fill:#B5D4F4}.e-s{fill:#85B7EB}
.orbit{stroke:#EF9F27}
.mtn{fill:#B4B2A9}
.gun{stroke:#D3D1C7}
.bdg{fill:#444441;stroke:#B4B2A9}
.b-t{fill:#D3D1C7}
}
</style>

<rect class="bg" x="0" y="0" width="680" height="473" rx="12"/>

<circle class="orbit" cx="340" cy="222" r="180"/>

<circle class="earth" cx="340" cy="222" r="150"/>
<text class="tt e-t" x="340" y="218" text-anchor="middle" dominant-baseline="central">지구</text>
<text class="st e-s" x="340" y="238" text-anchor="middle" dominant-baseline="central">질량 M, 반지름 R</text>

<path class="mtn" d="M310 74 L340 40 L370 74 Z"/>
<line class="gun" x1="324" y1="50" x2="344" y2="42"/>

<text class="st lb" x="292" y="44" text-anchor="end">수평 발사속도 v</text>
<line class="lead" x1="298" y1="46" x2="320" y2="50"/>

<path class="traj" d="M340 42 C 375 44, 402 67, 415 92" marker-end="url(#arrow)"/>
<path class="traj" d="M340 42 C 395 45, 450 92, 470 147" marker-end="url(#arrow)"/>
<path class="traj" d="M340 42 C 425 46, 520 127, 488 248" marker-end="url(#arrow)"/>

<circle class="bdg" cx="402" cy="115" r="11"/>
<text class="st b-t" x="402" y="115" text-anchor="middle" dominant-baseline="central">A</text>
<circle class="bdg" cx="447" cy="160" r="11"/>
<text class="st b-t" x="447" y="160" text-anchor="middle" dominant-baseline="central">B</text>
<circle class="bdg" cx="462" cy="243" r="11"/>
<text class="st b-t" x="462" y="243" text-anchor="middle" dominant-baseline="central">C</text>

<text class="tt lb" x="340" y="428" text-anchor="middle">원궤도 · 제1우주속도</text>
<text class="st lb" x="340" y="448" text-anchor="middle">v₁ = √(gR) ≈ 7.91 km/s</text>
</svg>
