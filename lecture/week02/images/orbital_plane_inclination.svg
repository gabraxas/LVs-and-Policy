<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="궤도면과 경사각의 기하" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>궤도면과 경사각의 기하</title>
<desc>지구 구면 위에서 적도면과 궤도면이 교차하는 모습을 정사영으로 나타낸 그림. 두 평면이 만나는 교점선과 승교점, 그 지점에서 두 평면이 이루는 경사각 i를 표시</desc>
<defs>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path class="mk-o" d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
svg{font-family:Pretendard,"Noto Sans KR","NanumGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bg{fill:#FFFFFF}
.tt{font-size:14px;font-weight:500}
.st{font-size:12px;font-weight:400}
.lb{fill:#3d3d3a}
.earth{fill:#E6F1FB;stroke:#185FA5;stroke-width:.5}
.pole{fill:#0C447C}
.eq-f{fill:none;stroke:#5F5E5A;stroke-width:1.5}
.eq-b{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:5 4}
.or-f{fill:none;stroke:#D85A30;stroke-width:2}
.or-b{fill:none;stroke:#D85A30;stroke-width:1.2;stroke-dasharray:5 4}
.nodes{fill:none;stroke:#5F5E5A;stroke-width:1;stroke-dasharray:3 3}
.arc{fill:none;stroke:#D85A30;stroke-width:1.2}
.dir{stroke:#D85A30;stroke-width:2}
.dot-o{fill:#993C1D}
.ring-o{fill:none;stroke:#993C1D;stroke-width:1.2}
.t-o{fill:#993C1D}
.lead{fill:none;stroke:#888780;stroke-width:.5;stroke-dasharray:3 3}
@media (prefers-color-scheme:dark){
.bg{fill:#26251F}
.lb{fill:#c2c0b6}
.earth{fill:#0C447C;stroke:#85B7EB}
.pole{fill:#B5D4F4}
.eq-f{stroke:#D3D1C7}.eq-b{stroke:#9c9a92}
.or-f{stroke:#F0997B}.or-b{stroke:#F0997B}
.nodes{stroke:#9c9a92}
.arc{stroke:#F0997B}.dir{stroke:#F0997B}.mk-o{stroke:#F0997B}
.dot-o{fill:#F5C4B3}.ring-o{stroke:#F5C4B3}.t-o{fill:#F5C4B3}
.lead{stroke:#9c9a92}
}
</style>

<rect class="bg" x="0" y="0" width="680" height="360" rx="12"/>

<circle class="earth" cx="340" cy="190" r="140"/>

<path class="eq-b" d="M200 190 A140 93.7 0 0 1 480 190"/>
<path class="or-b" d="M258.3 303.7 A140 31.7 125.7 0 1 421.7 76.3"/>
<path class="nodes" d="M303.8 280.5 L376.2 99.5"/>
<path class="eq-f" d="M200 190 A140 93.7 0 0 0 480 190"/>
<path class="or-f" d="M258.3 303.7 A140 31.7 125.7 0 0 421.7 76.3"/>

<path class="arc" d="M337.3 286.5 A34 34 0 0 0 328.8 257.5"/>
<text class="tt t-o" x="352" y="268">i</text>

<line class="dir" x1="339.9" y1="241.9" x2="351.4" y2="228.1" marker-end="url(#arrO)"/>

<circle class="dot-o" cx="303.8" cy="280.5" r="4"/>
<circle class="ring-o" cx="376.2" cy="99.5" r="4"/>
<circle class="pole" cx="340" cy="86" r="3"/>
<text class="st pole" x="340" y="72" text-anchor="middle">북극</text>

<path class="lead" d="M225.3 243.7 L186 256"/>
<text class="st lb" x="180" y="260" text-anchor="end">적도면</text>
<path class="lead" d="M417.6 118.7 L496 104"/>
<text class="st lb" x="502" y="108">궤도면</text>
<path class="lead" d="M303.8 280.5 L262 315"/>
<text class="st lb" x="256" y="319" text-anchor="end">승교점</text>
</svg>
