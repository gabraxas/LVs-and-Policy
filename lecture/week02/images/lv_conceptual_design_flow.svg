<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1088" viewBox="0 0 680 1088" role="img" aria-label="우주발사체 개념설계 절차 흐름도" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>우주발사체 개념설계 절차 흐름도</title>
<desc>임무 요구조건 정의부터 추진기관 선정, 단 구성, 질량 배분, 궤도 검증, 외형 및 부분체 개념설계를 거쳐 반복 수렴에 이르는 12단계 절차와 되먹임 경로</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
svg{font-family:Pretendard,"Noto Sans KR","NanumGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bg{fill:#FFFFFF}
.ph{font-size:14px;font-weight:500;fill:#3d3d3a}
.tt{font-size:14px;font-weight:500}
.st{font-size:12px;font-weight:400}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.loop{stroke:#888780;stroke-width:1;stroke-dasharray:5 4;fill:none}
.lb{fill:#5F5E5A}
.r-pu{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.t-pu{fill:#3C3489}.s-pu{fill:#534AB7}
.r-te{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.t-te{fill:#085041}.s-te{fill:#0F6E56}
.r-co{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.t-co{fill:#712B13}.s-co{fill:#993C1D}
.r-pi{fill:#FBEAF0;stroke:#993556;stroke-width:.5}
.t-pi{fill:#72243E}.s-pi{fill:#993556}
.r-gr{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.t-gr{fill:#2C2C2A}.s-gr{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#26251F}
.ph{fill:#c2c0b6}
.arr{stroke:#9c9a92}
.loop{stroke:#9c9a92}
.lb{fill:#B4B2A9}
.r-pu{fill:#3C3489;stroke:#AFA9EC}.t-pu{fill:#CECBF6}.s-pu{fill:#AFA9EC}
.r-te{fill:#085041;stroke:#5DCAA5}.t-te{fill:#9FE1CB}.s-te{fill:#5DCAA5}
.r-co{fill:#712B13;stroke:#F0997B}.t-co{fill:#F5C4B3}.s-co{fill:#F0997B}
.r-pi{fill:#72243E;stroke:#ED93B1}.t-pi{fill:#F4C0D1}.s-pi{fill:#ED93B1}
.r-gr{fill:#444441;stroke:#B4B2A9}.t-gr{fill:#D3D1C7}.s-gr{fill:#B4B2A9}
}
</style>

<rect class="bg" x="0" y="0" width="680" height="1088" rx="12"/>

<text class="ph" x="60" y="26">① 임무 요구조건</text>
<rect class="r-pu" x="60" y="40" width="440" height="54" rx="8"/>
<text class="tt t-pu" x="84" y="60" dominant-baseline="central">1. 위성 중량 및 목표궤도 설정</text>
<text class="st s-pu" x="84" y="78" dominant-baseline="central">페이로드 질량, 고도·궤도경사각</text>
<line class="arr" x1="280" y1="98" x2="280" y2="120" marker-end="url(#arrow)"/>
<rect class="r-pu" x="60" y="124" width="440" height="54" rx="8"/>
<text class="tt t-pu" x="84" y="144" dominant-baseline="central">2. 총요구속도 산출</text>
<text class="st s-pu" x="84" y="162" dominant-baseline="central">궤도속도 + 중력·항력·조종 손실</text>
<line class="arr" x1="280" y1="182" x2="280" y2="214" marker-end="url(#arrow)"/>

<text class="ph" x="60" y="204">② 추진·단 구성</text>
<rect class="r-te" x="60" y="218" width="440" height="54" rx="8"/>
<text class="tt t-te" x="84" y="238" dominant-baseline="central">3. 추진기관 종류 및 성능 결정</text>
<text class="st s-te" x="84" y="256" dominant-baseline="central">액체/고체, 비추력 Isp, 추력 수준</text>
<line class="arr" x1="280" y1="276" x2="280" y2="298" marker-end="url(#arrow)"/>
<rect class="r-te" x="60" y="302" width="440" height="54" rx="8"/>
<text class="tt t-te" x="84" y="322" dominant-baseline="central">4. 단 수 결정</text>
<text class="st s-te" x="84" y="340" dominant-baseline="central">성능 이득과 복잡도·신뢰도 절충</text>
<line class="arr" x1="280" y1="360" x2="280" y2="382" marker-end="url(#arrow)"/>
<rect class="r-te" x="60" y="386" width="440" height="54" rx="8"/>
<text class="tt t-te" x="84" y="406" dominant-baseline="central">5. 각 단의 구조비 결정</text>
<text class="st s-te" x="84" y="424" dominant-baseline="central">구조질량 / 단 총질량 비율 가정</text>
<line class="arr" x1="280" y1="444" x2="280" y2="466" marker-end="url(#arrow)"/>
<rect class="r-te" x="60" y="470" width="440" height="54" rx="8"/>
<text class="tt t-te" x="84" y="490" dominant-baseline="central">6. 초기·최대 가속도 한계 설정</text>
<text class="st s-te" x="84" y="508" dominant-baseline="central">이륙 추력중량비, 최대 축방향 g 제한</text>
<line class="arr" x1="280" y1="528" x2="280" y2="560" marker-end="url(#arrow)"/>

<text class="ph" x="60" y="550">③ 질량 배분</text>
<rect class="r-co" x="60" y="564" width="440" height="54" rx="8"/>
<text class="tt t-co" x="84" y="584" dominant-baseline="central">7. 단별 필요속도 배분</text>
<text class="st s-co" x="84" y="602" dominant-baseline="central">낙하점 제한 등 운용 제약 반영</text>
<line class="arr" x1="280" y1="622" x2="280" y2="644" marker-end="url(#arrow)"/>
<rect class="r-co" x="60" y="648" width="440" height="54" rx="8"/>
<text class="tt t-co" x="84" y="668" dominant-baseline="central">8. 각 단 무게 산출</text>
<text class="st s-co" x="84" y="686" dominant-baseline="central">추진제·구조질량 및 총 이륙질량</text>
<line class="arr" x1="280" y1="706" x2="280" y2="738" marker-end="url(#arrow)"/>

<text class="ph" x="60" y="728">④ 검증·형상 설계</text>
<rect class="r-pi" x="60" y="742" width="440" height="54" rx="8"/>
<text class="tt t-pi" x="84" y="762" dominant-baseline="central">9. 궤도 특성 분석 및 낙하점 점검</text>
<text class="st s-pi" x="84" y="780" dominant-baseline="central">초기 3-DOF, 상세 단계 6-DOF</text>
<line class="arr" x1="280" y1="800" x2="280" y2="822" marker-end="url(#arrow)"/>
<rect class="r-pi" x="60" y="826" width="440" height="54" rx="8"/>
<text class="tt t-pi" x="84" y="846" dominant-baseline="central">10. 외형 설계</text>
<text class="st s-pi" x="84" y="864" dominant-baseline="central">직경·전장·세장비, 페어링 형상</text>
<line class="arr" x1="280" y1="884" x2="280" y2="906" marker-end="url(#arrow)"/>
<rect class="r-pi" x="60" y="910" width="440" height="54" rx="8"/>
<text class="tt t-pi" x="84" y="930" dominant-baseline="central">11. 부분체별 개념설계</text>
<text class="st s-pi" x="84" y="948" dominant-baseline="central">구조·유도제어·전자·지상계</text>
<line class="arr" x1="280" y1="968" x2="280" y2="1000" marker-end="url(#arrow)"/>

<text class="ph" x="60" y="990">⑤ 종합 반복</text>
<rect class="r-gr" x="60" y="1004" width="440" height="54" rx="8"/>
<text class="tt t-gr" x="84" y="1024" dominant-baseline="central">12. 발사체 전체 개념설계 확정</text>
<text class="st s-gr" x="84" y="1042" dominant-baseline="central">반복 수렴을 통한 형상·제원 확정</text>

<path class="loop" d="M500 769 H545 V591 H506" marker-end="url(#arrow)"/>
<path class="loop" d="M500 1031 H620 V245 H506" marker-end="url(#arrow)"/>
<text class="st lb" x="552" y="700">궤적</text>
<text class="st lb" x="552" y="716">재검토</text>
<text class="st lb" x="628" y="700">전체</text>
<text class="st lb" x="628" y="716">재설계</text>
</svg>
